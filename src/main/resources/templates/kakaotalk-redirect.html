<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>외부 브라우저로 이동 중...</title>
  <style>
    body {
      text-align: center;
      padding-top: 20vh;
      color: #333;
    }
    .spinner {
      margin: 2rem auto;
      border: 4px solid #eee;
      border-top: 4px solid #3a7bd5;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
<h2>외부 브라우저로 이동 중입니다...</h2>
<p>잠시만 기다려주세요.</p>
<div class="spinner"></div>

<script>
  (function() {
    const params = new URLSearchParams(window.location.search);
    const target = decodeURIComponent(params.get("target") || "");
    if (!target) return;

    // 카카오 인앱 감지 후 외부 브라우저 호출
    if (navigator.userAgent.includes("KAKAOTALK")) {
      const encoded = encodeURIComponent(target);
      setTimeout(() => {
        window.location.href = `kakaotalk://web/openExternal?url=${encoded}`;
      }, 700);
    } else {
      // 일반 브라우저라면 원래 URL로 바로 이동
      window.location.href = target;
    }
  })();
</script>
</body>
</html>
